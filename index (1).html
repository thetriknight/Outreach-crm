<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outreach CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0F1115; --panel:#161920; --panel-2:#1D212A; --line: rgba(255,255,255,0.08);
    --text:#E7E8EA; --text-dim:#8B90A0; --accent:#5EEAD4; --accent-dim:#2A9D8F;
    --warn:#F2A900; --danger:#E8615A; --new:#7C8CF8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,Inter,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:28px 20px 80px;}
  .wrap{max-width:1180px; margin:0 auto;}
  h1{font-size:22px; font-weight:700;}
  .mono{font-family:monospace;}
  .btn{display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:#0B1210; border:none; border-radius:6px; padding:10px 18px; font-weight:600; font-size:14px; cursor:pointer;}
  .btn:hover{background:#7FF2DE;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--text);}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-sm{padding:6px 12px; font-size:12.5px; border-radius:5px;}
  input, select, textarea{background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:9px 12px; font-size:14px; outline:none;}

  /* login screen */
  #loginScreen{max-width:360px; margin:100px auto; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:32px;}
  #loginScreen h1{margin-bottom:20px;}
  #loginScreen .field{margin-bottom:14px;}
  #loginScreen input{width:100%;}
  #loginError{color:var(--danger); font-size:13px; margin-top:10px; display:none;}

  /* app */
  #app{display:none;}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:24px;}
  .stats{display:flex; gap:10px; flex-wrap:wrap;}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 16px;}
  .stat .n{font-size:20px; font-weight:700;}
  .stat .l{font-size:11px; color:var(--text-dim); text-transform:uppercase;}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  #search{flex:1; min-width:180px;}
  table{width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  thead th{text-align:left; font-size:11px; text-transform:uppercase; color:var(--text-dim); padding:12px 14px; border-bottom:1px solid var(--line); background:var(--panel-2);}
  tbody td{padding:14px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  .biz-name{font-weight:600;}
  .biz-phone{font-size:12.5px; color:var(--text-dim); margin-top:2px;}
  .status-pill{font-size:11px; padding:4px 10px; border-radius:999px; display:inline-block;}
  .status-New{background:rgba(124,140,248,0.15); color:var(--new);}
  .status-Contacted{background:rgba(94,234,212,0.12); color:var(--accent);}
  .status-Interested{background:rgba(242,169,0,0.14); color:var(--warn);}
  .status-DemoSent{background:rgba(217,140,60,0.15); color:#D98C3C;}
  .status-FollowUp{background:rgba(232,97,90,0.12); color:var(--danger);}
  .status-Closed{background:rgba(94,234,212,0.22); color:#0B1210;}
  .status-NotInterested{background:rgba(255,255,255,0.06); color:var(--text-dim);}
  .followup-cell.overdue{color:var(--danger); font-weight:600;}
  .notes-cell{max-width:220px; color:var(--text-dim); font-size:13px;}
  .row-actions{display:flex; gap:6px;}
  .empty{padding:60px 20px; text-align:center; color:var(--text-dim);}

  .overlay{display:none; position:fixed; inset:0; background:rgba(5,6,8,0.6); align-items:center; justify-content:center; z-index:100; padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:12px; width:100%; max-width:460px; padding:26px;}
  .modal h2{font-size:18px; margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px;}
  .field input, .field select, .field textarea{width:100%;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:22px;}
</style>
</head>
<body>

<!-- ====== SET THESE TWO VALUES FROM SUPABASE PROJECT SETTINGS > API ====== -->
<script>
  const SUPABASE_URL = "YOUR_SUPABASE_URL_HERE";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY_HERE";
</script>

<div id="loginScreen">
  <h1>📋 Outreach CRM</h1>
  <div class="field"><input type="text" id="loginEmail" placeholder="Email"></div>
  <div class="field"><input type="password" id="loginPassword" placeholder="Password"></div>
  <button class="btn" id="loginBtn" style="width:100%; justify-content:center;">Log In</button>
  <div id="loginError"></div>
</div>

<div id="app">
  <div class="wrap">
    <div class="topbar">
      <h1>📋 Outreach CRM</h1>
      <div class="stats" id="stats"></div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Log Out</button>
    </div>
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search business or phone…">
      <select id="filterIndustry"><option value="">All industries</option></select>
      <select id="filterStatus">
        <option value="">All statuses</option>
        <option>New</option><option>Contacted</option><option>Interested</option>
        <option>Demo Sent</option><option>Follow-Up</option><option>Closed</option><option>Not Interested</option>
      </select>
      <button class="btn" id="addBtn">+ Add Lead</button>
    </div>
    <div id="tableHolder"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Add Lead</h2>
    <input type="hidden" id="editId">
    <div class="field"><label>Business Name</label><input type="text" id="f-business"></div>
    <div class="field"><label>Phone</label><input type="text" id="f-phone"></div>
    <div class="field"><label>Industry</label><input type="text" id="f-industry"></div>
    <div class="field"><label>Status</label>
      <select id="f-status">
        <option>New</option><option>Contacted</option><option>Interested</option>
        <option>Demo Sent</option><option>Follow-Up</option><option>Closed</option><option>Not Interested</option>
      </select>
    </div>
    <div class="field"><label>Follow-up Date</label><input type="date" id="f-followup"></div>
    <div class="field"><label>Notes</label><textarea id="f-notes"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
      <button class="btn" id="saveBtn">Save Lead</button>
    </div>
  </div>
</div>

<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let leads = [];

async function checkSession(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ showApp(); loadLeads(); } else { showLogin(); }
}
function showLogin(){ document.getElementById('loginScreen').style.display='block'; document.getElementById('app').style.display='none'; }
function showApp(){ document.getElementById('loginScreen').style.display='none'; document.getElementById('app').style.display='block'; }

document.getElementById('loginBtn').addEventListener('click', async ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  const errEl = document.getElementById('loginError');
  if(error){ errEl.textContent = error.message; errEl.style.display='block'; }
  else { errEl.style.display='none'; showApp(); loadLeads(); }
});
document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  await sb.auth.signOut(); showLogin();
});

async function loadLeads(){
  const { data, error } = await sb.from('leads').select('*').order('followup', { ascending: true, nullsFirst: false });
  leads = error ? [] : data;
  render();
}

function uid(){ return 'l'+Date.now(); }
function statusClass(s){ return 'status-' + (s||'').replace(/[^a-zA-Z]/g,''); }
function isOverdue(dateStr){
  if(!dateStr) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return new Date(dateStr+'T00:00:00') < today;
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

function render(){
  const search = document.getElementById('search').value.toLowerCase();
  const fIndustry = document.getElementById('filterIndustry').value;
  const fStatus = document.getElementById('filterStatus').value;

  const industries = [...new Set(leads.map(l=>l.industry).filter(Boolean))].sort();
  const indSelect = document.getElementById('filterIndustry');
  const cur = indSelect.value;
  indSelect.innerHTML = '<option value="">All industries</option>' + industries.map(i=>`<option ${i===cur?'selected':''}>${i}</option>`).join('');

  let filtered = leads.filter(l=>{
    const matchSearch = !search || l.business.toLowerCase().includes(search) || (l.phone||'').toLowerCase().includes(search);
    const matchInd = !fIndustry || l.industry === fIndustry;
    const matchStat = !fStatus || l.status === fStatus;
    return matchSearch && matchInd && matchStat;
  });

  const total = leads.length;
  const interested = leads.filter(l=>l.status==='Interested'||l.status==='Demo Sent').length;
  const closed = leads.filter(l=>l.status==='Closed').length;
  const overdue = leads.filter(l=>isOverdue(l.followup) && l.status!=='Closed' && l.status!=='Not Interested').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${total}</div><div class="l">Total</div></div>
    <div class="stat"><div class="n">${interested}</div><div class="l">Interested</div></div>
    <div class="stat"><div class="n">${closed}</div><div class="l">Closed</div></div>
    <div class="stat"><div class="n" style="${overdue?'color:#E8615A':''}">${overdue}</div><div class="l">Overdue</div></div>
  `;

  const holder = document.getElementById('tableHolder');
  if(filtered.length===0){ holder.innerHTML = `<div class="empty">No leads yet. Add your first one.</div>`; return; }

  holder.innerHTML = `
    <table>
      <thead><tr><th>Business</th><th>Industry</th><th>Status</th><th>Follow-up</th><th>Notes</th><th></th></tr></thead>
      <tbody>
        ${filtered.map(l => `
          <tr>
            <td><div class="biz-name">${escapeHtml(l.business)}</div><div class="biz-phone">${escapeHtml(l.phone)}</div></td>
            <td>${l.industry ? `<span class="status-pill status-New">${escapeHtml(l.industry)}</span>` : ''}</td>
            <td><span class="status-pill ${statusClass(l.status)}">${l.status}</span></td>
            <td><span class="${isOverdue(l.followup)&&l.status!=='Closed'?'followup-cell overdue':'followup-cell'}">${l.followup||'—'}</span></td>
            <td><div class="notes-cell">${escapeHtml((l.notes||'').slice(0,80))}</div></td>
            <td><div class="row-actions">
              <button class="btn btn-ghost btn-sm" onclick="openEdit('${l.id}')">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteLead('${l.id}')">Delete</button>
            </div></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function openAdd(){
  document.getElementById('modalTitle').textContent='Add Lead';
  document.getElementById('editId').value='';
  ['business','phone','industry','followup','notes'].forEach(k=>document.getElementById('f-'+k).value='');
  document.getElementById('f-status').value='New';
  document.getElementById('overlay').classList.add('show');
}
function openEdit(id){
  const l = leads.find(x=>x.id===id); if(!l) return;
  document.getElementById('modalTitle').textContent='Edit Lead';
  document.getElementById('editId').value=l.id;
  document.getElementById('f-business').value=l.business||'';
  document.getElementById('f-phone').value=l.phone||'';
  document.getElementById('f-industry').value=l.industry||'';
  document.getElementById('f-status').value=l.status||'New';
  document.getElementById('f-followup').value=l.followup||'';
  document.getElementById('f-notes').value=l.notes||'';
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }

async function saveLead(){
  const id = document.getElementById('editId').value;
  const business = document.getElementById('f-business').value.trim();
  if(!business){ alert('Business name required.'); return; }
  const data = {
    business,
    phone: document.getElementById('f-phone').value.trim(),
    industry: document.getElementById('f-industry').value.trim(),
    status: document.getElementById('f-status').value,
    followup: document.getElementById('f-followup').value || null,
    notes: document.getElementById('f-notes').value.trim(),
  };
  if(id){ await sb.from('leads').update(data).eq('id', id); }
  else { await sb.from('leads').insert(data); }
  closeModal(); loadLeads();
}
async function deleteLead(id){
  if(!confirm('Delete this lead?')) return;
  await sb.from('leads').delete().eq('id', id);
  loadLeads();
}

document.getElementById('addBtn').addEventListener('click', openAdd);
document.getElementById('cancelBtn').addEventListener('click', closeModal);
document.getElementById('saveBtn').addEventListener('click', saveLead);
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });
document.getElementById('search').addEventListener('input', render);
document.getElementById('filterIndustry').addEventListener('change', render);
document.getElementById('filterStatus').addEventListener('change', render);

checkSession();
</script>
</body>
</html>
